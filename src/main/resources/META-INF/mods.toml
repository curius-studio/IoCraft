
modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"
#issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/" #optional
[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
#updateJSONURL="https://change.me.example.invalid/updates.json" #optional
#displayURL="https://change.me.to.your.mods.homepage.example.invalid/" #optional
logoFile="logo.png" #optional
#credits="IoCraft by Jose Escorcia (Curius). Gracias a la comunidad maker y dev por feedback y pruebas." #optional
description='''
IoCraft integra dispositivos IoT locales con Minecraft mediante WebSocket, con enfoque en redes LAN y seguridad operativa.

Incluye:
- Bloques IoT (Computer, Sensor, Emisor y Puerta) para interacción in-game.
- Autenticación por dispositivo (HMAC + nonce anti-replay), roles y control de sesiones.
- Gestión de credenciales (rotate/revoke), blacklist por IP/device y comandos de diagnóstico.
- API pública versionada para mods compatibles (addons) con eventos, métricas y políticas por addon.

Diseñado para extenderse de forma aditiva sin romper el core.
'''
[[dependencies.${mod_id}]] #optional
modId="forge" #mandatory
mandatory=true #mandatory
# The version range of the dependency
versionRange="${forge_version_range}" #mandatory
ordering="NONE"
side="BOTH"
[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
